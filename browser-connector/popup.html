<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>会客厅连接组件</title><link rel="stylesheet" href="popup.css"></head><body><h1>连接会客厅群聊室</h1><p>继续使用本浏览器已登录的官网账号。登录在官网完成。</p><label for="code">输入平台右侧显示的 6 位配对码</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button id="pair">配对并连接</button><p id="status" role="status">正在检查连接……</p><button id="reconnect">重新连接</button><button id="disconnect">断开连接</button><p class="note">连接后，平台可向你选择的 AI 官网标签页发送讨论内容并读取回复。不会读取密码或 Cookie。</p><script src="popup.js"></script></body></html>
